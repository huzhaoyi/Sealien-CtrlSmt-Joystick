# 系统配置
enable_modbus: true   # 启用Modbus功能

# Modbus串口配置
# 支持智能串口检测：设置为 "auto" 或 "smart" 将自动检测最佳串口设备
# 支持多种厂商芯片：FTDI/CP210x/CH34x/CDC ACM/PL2303等
serial_port: auto   # 智能检测模式，自动选择最佳串口设备
# serial_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG024F00-if00-port0   # 手动指定串口（符号链接）
# serial_port: /dev/ttyUSB0   # 手动指定串口（设备节点）
baud: 115200
parity: N
data_bits: 8
stop_bits: 1
slave_id: 1
poll_hz: 50  # 降低轮询频率，减少通信压力
bus_error_threshold: 2  # 增加错误判定时间阈值，提高稳定性

# 电压映射参数配置
voltage_mapping:
  min_voltage: 0.5    # 最小电压值 (V)
  mid_voltage: 2.5    # 中间电压值 (V) 
  max_voltage: 4.5    # 最大电压值 (V)
  modbus_max_value: 4095  # Modbus寄存器最大值

# 连续量 → 轴（[-32767, 32767]）
# 根据AMSAMOTION端子定义配置模拟量输入/输出通道
# 电压映射将通过代码动态计算，无需在配置中指定raw_min/raw_max

#lpf_alpha = 1.0：不开滤波（完全不过滤）
#lpf_alpha = 0.0：完全滤波（输出完全平滑，不响应变化）
#lpf_alpha = 0.5：中等滤波（50%的原始信号 + 50%的滤波信号）
axes:
  # 模拟量输入通道（0~10V电压输入）
  - {code: ABS_X,  source: {type: "input_register", addr: 0}, deadzone: 0.12, lpf_alpha: 1.0, invert: false, swap_endian: false, ros2_joy_index: 6}  # V1 - 第一路模拟量 0~10V 电压输入 -> Joy.axes[0] 左摇杆X轴
  - {code: ABS_Y,  source: {type: "input_register", addr: 1}, deadzone: 0.12, lpf_alpha: 1.0, invert: false, swap_endian: false, ros2_joy_index: 7}  # V2 - 第二路模拟量 0~10V 电压输入 -> Joy.axes[1] 左摇杆Y轴
  - {code: ABS_Z,  source: {type: "input_register", addr: 2}, deadzone: 0.12, lpf_alpha: 1.0, invert: false, swap_endian: false, ros2_joy_index: 8}  # V3 - 第三路模拟量 0~10V 电压输入 -> Joy.axes[2] 右摇杆X轴
  
  # 模拟量输入通道（0~20mA电流输入）
  - {code: ABS_RX, source: {type: "input_register", addr: 3}, deadzone: 0.12, lpf_alpha: 1.0, invert: false, swap_endian: false, ros2_joy_index: 9}  # I1 - 第一路模拟量 0~20mA 电流输入 -> Joy.axes[3] 右摇杆Y轴
  - {code: ABS_RY, source: {type: "input_register", addr: 4}, deadzone: 0.12, lpf_alpha: 1.0, invert: false, swap_endian: false, ros2_joy_index: -1}  # I2 - 第二路模拟量 0~20mA 电流输入 -> Joy.axes[4] 左触发器
  - {code: ABS_RZ, source: {type: "input_register", addr: 5}, deadzone: 0.12, lpf_alpha: 1.0, invert: false, swap_endian: false, ros2_joy_index: -1}  # I3 - 第三路模拟量 0~20mA 电流输入 -> Joy.axes[5] 右触发器
  
  # 模拟量输出通道（0~10V电压输出）
  - {code: ABS_THROTTLE, source: {type: "holding_register", addr: 0}, deadzone: 0.12, lpf_alpha: 0.1, invert: false, swap_endian: false, ros2_joy_index: -1}  # V4 - 第一路模拟量电压 0~10V 输出 -> Joy.axes[6] 油门轴
  - {code: ABS_RUDDER,   source: {type: "holding_register", addr: 1}, deadzone: 0.12, lpf_alpha: 0.1, invert: false, swap_endian: false, ros2_joy_index: -1}  # V5 - 第二路模拟量电压 0~10V 输出 -> Joy.axes[7] 方向舵轴
  
  # 模拟量输出通道（0~20mA电流输出）
  - {code: ABS_GAS,      source: {type: "holding_register", addr: 2}, deadzone: 0.12, lpf_alpha: 0.1, invert: false, swap_endian: false, ros2_joy_index: -1}  # I4 - 第一路模拟量电流 0~20mA 输出 -> Joy.axes[8] 油门轴
  - {code: ABS_BRAKE,    source: {type: "holding_register", addr: 3}, deadzone: 0.12, lpf_alpha: 0.1, invert: false, swap_endian: false, ros2_joy_index: -1}  # I5 - 第二路模拟量电流 0~20mA 输出 -> Joy.axes[9] 刹车轴

# Bit → 按钮（8路数字量输入）
# 根据AMSAMOTION端子定义：0.0-0.7 对应第1-8路数字量输入
buttons:
  - {code: BTN_TRIGGER_HAPPY1,  source: {type: "discrete_input", addr: 0},  debounce_ms: 10, active_high: true, ros2_joy_index: 0}  # 0.0 - 第1路数字量输入 -> Joy.buttons[0] A按钮
  - {code: BTN_TRIGGER_HAPPY2,  source: {type: "discrete_input", addr: 1},  debounce_ms: 10, active_high: true, ros2_joy_index: 1}  # 0.1 - 第2路数字量输入 -> Joy.buttons[1] B按钮
  - {code: BTN_TRIGGER_HAPPY3,  source: {type: "discrete_input", addr: 2},  debounce_ms: 10, active_high: true, ros2_joy_index: 2}  # 0.2 - 第3路数字量输入 -> Joy.buttons[2] X按钮
  - {code: BTN_TRIGGER_HAPPY4,  source: {type: "discrete_input", addr: 3},  debounce_ms: 10, active_high: true, ros2_joy_index: -1}  # 0.3 - 第4路数字量输入 -> Joy.buttons[3] Y按钮
  - {code: BTN_TRIGGER_HAPPY5,  source: {type: "discrete_input", addr: 4},  debounce_ms: 10, active_high: true, ros2_joy_index: -1}  # 0.4 - 第5路数字量输入 -> Joy.buttons[4] 左肩按钮
  - {code: BTN_TRIGGER_HAPPY6,  source: {type: "discrete_input", addr: 5},  debounce_ms: 10, active_high: true, ros2_joy_index: -1}  # 0.5 - 第6路数字量输入 -> Joy.buttons[5] 右肩按钮
  - {code: BTN_TRIGGER_HAPPY7,  source: {type: "discrete_input", addr: 6},  debounce_ms: 10, active_high: true, ros2_joy_index: -1}  # 0.6 - 第7路数字量输入 -> Joy.buttons[6] 选择按钮
  - {code: BTN_TRIGGER_HAPPY8,  source: {type: "discrete_input", addr: 7},  debounce_ms: 10, active_high: true, ros2_joy_index: -1}  # 0.7 - 第8路数字量输入 -> Joy.buttons[7] 开始按钮

# 两路 bit 组合为离散轴（-1/0/+1）
# 注意：由于数字量输入已全部用于按钮，这里暂时不配置离散轴
# 如需使用离散轴，可以复用部分按钮通道
