# 阀控板 Modbus 配置文件
# 设备型号：MVPE 阀控板
# 协议：Modbus RTU
# 功能码：03 (读保持寄存器), 06 (写单个保持寄存器), 16 (写多个保持寄存器)
# 参考文档：docs/阀控板 Modbus 寄存器说明.md

# ============================================
# 阀控板串口配置
# ============================================
# 注意：阀控板使用独立的串口和波特率，与主设备串口分离
valve_control:
  serial_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG038ITD-if00-port0   # 手动指定串口（符号链接）
  # serial_port: /dev/ttyUSB2   # 阀控板串口设备路径（请根据实际设备修改）
  # serial_port: auto   # 也可以使用智能检测模式（如果支持）
  baud: 19200        # 阀控板波特率（请根据实际设备设置，支持范围：1200-921600）
  parity: N           # 校验位：N=无校验, E=偶校验, O=奇校验
  data_bits: 8        # 数据位：8
  stop_bits: 1        # 停止位：1或2
  slave_id: 1         # 阀控板Modbus从站ID（请根据实际设备设置，范围：1-247）

# ============================================
# 寄存器说明（参考 docs/阀控板 Modbus 寄存器说明.md）
# ============================================
# 地址0：累加寄存器（每1s+1，用于判断故障）
# 地址1：PCB状态（预留）
# 地址2-21：阀1-40电流值（只读，用于显示和核对）
# 地址22-45：传感器1-24数据（只读）
# 地址46-49：编码器1-2计数值（32位有符号，只读）
# 地址50：接近开关6~1的状态（只读）
# 地址51-55：湿度、温度、板载传感器数据（只读）
# 地址56-60：阀1-40状态寄存器（只读，每2bit表示1个阀的状态）
#    - 0：正常状态
#    - 2：报警状态（短路或开路）
#    - 3：离线状态
# 地址61-62：传感器1-24状态（只读）
# 地址63：心跳寄存器（主机写入，用于心跳检测）
#    - 心跳值每次发送不同的心跳值
#    - 默认2秒内没有收到新的心跳值，那么输出将关闭
# 地址64-103：阀1-40电流值设定（16位有符号整数，可写）
#    - 范围：-32767 到 32767
#    - 当设定值小于0时，对应阀电流应调节至0
#    - 摇杆值映射：归一化值[0.0, 1.0] -> 整数[0, 10000]（每个轴拆分为两个正值通道）
# 地址104-105：24V传感器1-32电源开关（可写）
# 地址106-108：传感器1-24配置（可写）
# 地址109-128：阀1-40频率设定（可写，单位：HZ，输入11~250，实际输出110~2500hz）
# 地址129：编码器1-2清0（可写）
# 地址130：Modbus地址（可写）
# 地址131：波特率设定选择（可写，1:9600bps，2:19200bps，3:38400bps，4:57600bps，5:115200bps）
# 地址132：复位（可写，01：RS485，02：RS422，0x10：复位）

# ============================================
# 摇杆到阀的映射说明
# ============================================
# 16个摇杆轴映射到32个阀通道（地址64-95）：
# - 每个摇杆轴对应2个阀通道（正向和反向，都转换为正值）
# - 例如：axes[0] -> valve[0] (地址64, 正向), valve[1] (地址65, 反向)
# - 例如：axes[1] -> valve[2] (地址66, 正向), valve[3] (地址67, 反向)
# - ...
# - 例如：axes[15] -> valve[30] (地址94, 正向), valve[31] (地址95, 反向)
# 
# 映射逻辑：
# - 正向通道：joystick_value >= 0 时，值为 joystick_value；否则为 0
# - 反向通道：joystick_value < 0 时，值为 abs(joystick_value)；否则为 0
# - 最终写入值：归一化值 * 10000（例如：0.5 -> 5000, 1.0 -> 10000）
# - 写入地址：64 + valve_index（valve_index从0开始，对应阀1-40）

