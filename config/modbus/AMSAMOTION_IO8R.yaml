# 数字量输出配置说明（通过coil控制）
# 根据AMSAMOTION端子定义：0.0-0.7 对应第1-8路数字量输出
# 注意：数字量输出通过Modbus coil功能码控制，不在axes/buttons配置中
# 如需控制数字量输出，请使用Modbus写入功能
